<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Detect Human — app icon</title>
  <desc id="desc">A minimal human silhouette inside vibrant green facial-recognition brackets on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#293139"/>
      <stop offset="1" stop-color="#10161B"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0F6F3"/>
      <stop offset="1" stop-color="#B8D5C8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EFFAB"/>
      <stop offset="1" stop-color="#14D966"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="248" height="248" rx="54" fill="url(#background)"/>
  <rect x="5" y="5" width="246" height="246" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Person / facial-recognition subject -->
  <path d="M79 190c0-21 18-36 39-39 6 6 14 9 23 9 9 0 17-3 23-9 21 3 39 18 39 39v8c0 5-4 9-9 9H88c-5 0-9-4-9-9z"
        transform="translate(-13 0)" fill="url(#person)"/>
  <path d="M128 67c-25 0-40 19-40 44 0 27 18 48 40 48s40-21 40-48c0-25-15-44-40-44z"
        fill="url(#person)"/>

  <!-- Four tracking brackets -->
  <g fill="none" stroke="url(#scan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 48H61c-7 0-13 6-13 13v19"/>
    <path d="M176 48h19c7 0 13 6 13 13v19"/>
    <path d="M48 176v19c0 7 6 13 13 13h19"/>
    <path d="M208 176v19c0 7-6 13-13 13h-19"/>
  </g>

  <!-- Subtle biometric scan, integrated into the face -->
  <path d="M99 112h58" stroke="#17D86D" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <circle cx="128" cy="112" r="5" fill="#E3FFE9"/>
</svg>
